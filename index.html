<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7a8d5"><title>Svenjas königlicher Countdown 👑</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Svenjas Countdown"><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;font-family:system-ui,sans-serif;background:radial-gradient(circle at 20% 10%,#fff8d9,transparent 35%),linear-gradient(145deg,#ffe4f4,#f5b6e3 55%,#e4b6ff);color:#85316f;display:grid;place-items:center;overflow-x:hidden}.card{width:min(94vw,460px);margin:24px auto;padding:30px 22px;border:3px solid #fff7cc;border-radius:32px;text-align:center;background:#ffffffa8;box-shadow:0 18px 50px #a8408c55;backdrop-filter:blur(8px)}.crown{font-size:65px;filter:drop-shadow(0 4px 8px #d78db4)}h1{font-family:Georgia,serif;font-size:32px;margin:8px 0;color:#a32b7f}.sub{font-size:16px}.number{font-size:clamp(76px,20vw,116px);font-weight:900;line-height:1.1;color:#cf3d98;text-shadow:3px 4px #fff,0 0 18px #fff}.unit{font-size:22px;font-weight:750;margin-bottom:18px}.button{border:0;border-radius:100px;background:linear-gradient(130deg,#f84ea9,#b43fbc);color:white;padding:20px 24px;font-size:20px;font-weight:800;width:100%;box-shadow:0 8px 0 #9e327d,0 12px 22px #d44b9b66;cursor:pointer}.button:active{transform:translateY(5px);box-shadow:0 3px 0 #9e327d}.bubble{margin:25px 0 0;padding:17px;border-radius:22px;background:#fff8fd;border:2px dashed #e58bbf;min-height:95px;line-height:1.55}.footer{font-size:13px;opacity:.75;margin-top:22px}.spark{position:fixed;pointer-events:none;animation:fall linear forwards;z-index:5}@keyframes fall{from{transform:translateY(-15vh) rotate(0)}to{transform:translateY(115vh) rotate(720deg)}}.twinkle{animation:twinkle 1.8s infinite alternate}@keyframes twinkle{to{filter:drop-shadow(0 0 16px gold);transform:scale(1.07)}}@media(prefers-reduced-motion:reduce){.twinkle{animation:none}}</style></head><body><main class="card"><div class="crown twinkle">👑</div><h1>Svenjas königlicher Geburtstag</h1><p class="sub">Die ganze Welt wartet auf den 2. November! ✨</p><div id="days" class="number">…</div><div id="unit" class="unit">Tage bis zum großen Tag 💖</div><button class="button" id="speak">🎤 Königliche Ansage!</button><div class="bubble" id="message" aria-live="polite">Drück den Knopf und erfahre einen königlichen Fun-Fact! 💎</div><div class="footer">Mit Glitzer, Liebe und einer Prise unnützem Wissen 💕</div></main><script>
const facts={1:['Ein Ring, sie alle zu knechten – so beginnt eine ziemlich berühmte Fantasy-Geschichte.','Ein einziges Horn macht das Einhorn zum Einhorn!'],2:['Zwei Schuhe verlor Aschenputtel zwar nicht, aber einen ihrer zwei gläsernen Schuhe!','Zwei Monde hat der Planet Mars: Phobos und Deimos.'],3:['Drei Wünsche sind ein echter Märchenklassiker.','Drei Musketiere sind berühmt – obwohl d’Artagnan noch dazukommt.'],4:['Vier Tiere sind die Bremer Stadtmusikanten.','Vier Jahreszeiten gibt es im Jahr.'],5:['Fünf Finger hat eine menschliche Hand normalerweise.','Fünf olympische Ringe stehen für die Verbundenheit der Kontinente.'],6:['Sechs Seiten hat ein normaler Spielwürfel.','Sechs Beine haben Insekten.'],7:['Sieben Zwerge begleiten Schneewittchen.','Sieben Tage hat eine Woche – und jeder davon ist zu lang, wenn man auf Geburtstag wartet!'],8:['Acht Arme hat ein Oktopus.','Acht Planeten umkreisen unsere Sonne.'],9:['Neun Leben werden Katzen sprichwörtlich nachgesagt.','Neun Gefährten bilden die Gemeinschaft des Rings.'],10:['Zehn Finger haben die meisten Menschen.','Zehn Jahre dauerte der Trojanische Krieg laut der griechischen Sage.'],11:['Elf Spieler stehen bei einer Fußballmannschaft auf dem Feld.','Elf ist auch die deutsche Bezeichnung für ein märchenhaftes Wesen – aber nicht mit der Zahl zu verwechseln!'],12:['Zwölf Monate hat das Jahr.','Zwölf Schläge schlägt die Uhr um Mitternacht.'],13:['Dreizehn gilt manchen als Unglückszahl – für Svenja ist jeder Tag vor dem Geburtstag sowieso verdächtig.'],14:['Vierzehn Tage sind genau zwei Wochen.'],15:['Fünfzehn Spieler stehen bei Rugby Union pro Mannschaft auf dem Feld.'],16:['Sechzehn Figuren hat jede Seite zu Beginn einer Schachpartie.'],17:['Siebzehn ist eine Primzahl.'],18:['Achtzehn bedeutet in Deutschland: volljährig!'],19:['Neunzehn ist eine Primzahl.'],20:['Zwanzig Milchzähne hat ein vollständiges Kindergebiss.'],21:['Einundzwanzig Augen zeigen die gegenüberliegenden Seiten eines normalen Würfels zusammen – jeweils sieben pro Paar.'],22:['Zweiundzwanzig Spieler stehen beim Fußball insgesamt auf dem Feld.'],23:['Dreiundzwanzig Chromosomen stecken in einer menschlichen Ei- oder Samenzelle.'],24:['Vierundzwanzig Stunden hat ein Tag.'],25:['Fünfundzwanzig ist fünf mal fünf.'],26:['Sechsundzwanzig Buchstaben hat das englische Alphabet.'],27:['Siebenundzwanzig ist drei hoch drei.'],28:['Achtundzwanzig Tage hat der Februar mindestens.'],29:['Neunundzwanzig Tage hat der Februar in einem Schaltjahr.'],30:['Dreißig Tage haben April, Juni, September und November.'],31:['Einunddreißig Tage hat der Oktober – und dann kommt Svenjas Monat!']};
const names=['null','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf','zwölf'];const units=['','ein','zwei','drei','vier','fünf','sechs','sieben','acht','neun'];function german(n){if(n<13)return names[n];if(n<20)return (n===17?'sieb':n===16?'sech':names[n-10])+'zehn';if(n<100){const tens={20:'zwanzig',30:'dreißig',40:'vierzig',50:'fünfzig',60:'sechzig',70:'siebzig',80:'achtzig',90:'neunzig'};return n%10?units[n%10]+'und'+tens[n-n%10]:tens[n]}if(n<1000)return (n<200?'ein':german(Math.floor(n/100)))+'hundert'+(n%100?german(n%100):'');return String(n)}
function remaining(){const now=new Date(),today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());let year=now.getFullYear();let target=Date.UTC(year,10,2);if(today>target)target=Date.UTC(++year,10,2);return Math.round((target-today)/86400000)}let lastFact=-1;function pick(arr){let i=Math.floor(Math.random()*arr.length);if(arr.length>1&&i===lastFact)i=(i+1)%arr.length;lastFact=i;return arr[i]}function makeMessage(n){if(n===0)return 'Hört, hört! Heute ist Svenjas Geburtstag! Alles Gute, Eure königliche Hoheit! Möge dein Tag voller Kuchen, Geschenke, Glitzer und großartiger Überraschungen sein!';let fact=pick(facts[n]||[]);if(!fact){let endings=[];if(n%7===0)endings.push(`${n} Tage sind genau ${n/7} Wochen.`);if(n%10===0)endings.push(`${n} ist durch zehn teilbar – eine ausgesprochen runde Sache.`);if(n%2===0)endings.push(`${n} ist eine gerade Zahl. Anders als die Vorfreude, die ist völlig außer Kontrolle.`);else endings.push(`${n} ist ungerade. Genau wie die Vorstellung, noch so lange auf Kuchen zu warten.`);fact=pick(endings)}return `Es sind noch ${n} ${n===1?'Tag':'Tage'} bis zu Svenjas Geburtstag! ${fact}`}
function confetti(count=110){const chars=['💖','✨','🎉','🌸','💎','👑','⭐'];for(let i=0;i<count;i++){const e=document.createElement('span');e.className='spark';e.textContent=chars[Math.floor(Math.random()*chars.length)];e.style.left=Math.random()*100+'vw';e.style.top='-12vh';e.style.fontSize=12+Math.random()*20+'px';e.style.animationDuration=2.5+Math.random()*3+'s';e.style.animationDelay=Math.random()*1.6+'s';document.body.append(e);setTimeout(()=>e.remove(),7500)}}function render(){const n=remaining();document.getElementById('days').textContent=n;document.getElementById('unit').textContent=n===0?'HEUTE IST DER GROSSE TAG! 🎂':n===1?'Tag bis zum großen Tag 💖':'Tage bis zum großen Tag 💖';if(n===0&&window.birthdayCelebrated!==true){window.birthdayCelebrated=true;confetti(180);document.getElementById('message').textContent=makeMessage(0)}}document.getElementById('speak').addEventListener('click',()=>{const n=remaining(),msg=makeMessage(n);document.getElementById('message').textContent=msg;if(n===0)confetti(180);else confetti(22);if('speechSynthesis'in window){speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(msg);utter.lang='de-DE';utter.rate=.93;utter.pitch=1.12;const voices=speechSynthesis.getVoices();utter.voice=voices.find(v=>v.lang.toLowerCase().startsWith('de')&&/female|katja|anna|petra/i.test(v.name))||voices.find(v=>v.lang.toLowerCase().startsWith('de'))||null;speechSynthesis.speak(utter)}});render();setInterval(render,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
</script></body></html>
